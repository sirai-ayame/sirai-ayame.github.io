name: Verify pull request

on:
  pull_request:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7
      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: Lint source
        run: npm run lint
      - name: Run tests
        run: npm test
      - name: Check types
        run: npm run check
      - name: Build and verify site
        run: npm run test:site
